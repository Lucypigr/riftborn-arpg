name: Godot 4.3 test, Web build and Pages deploy

on:
  push:
    branches:
      - main
      - build-001-combat-core
  pull_request:
    branches:
      - main
      - build-001-combat-core
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE_TAG: 4.3-stable
  GODOT_TEMPLATE_VERSION: 4.3.stable
  GODOT_RELEASE_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

jobs:
  test-and-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download official Godot 4.3 editor and Web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          curl --fail --location --retry 3 \
            "$GODOT_RELEASE_URL/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/editor.zip"
          curl --fail --location --retry 3 \
            "$GODOT_RELEASE_URL/Godot_v${GODOT_RELEASE_TAG}_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          install -m 0755 "$RUNNER_TEMP/godot/editor/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64" "$RUNNER_TEMP/godot/godot4"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
          "$RUNNER_TEMP/godot/godot4" --version

      - name: Import project and parse resources
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot4" --headless --path . --editor --quit

      - name: Run combat test suite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/godot4" --headless --path . --script res://tests/combat_test.gd

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          "$RUNNER_TEMP/godot/godot4" --headless --path . \
            --export-release Web build/web/index.html
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: riftborn-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/build-001-combat-core'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    name: Deploy Web game to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/build-001-combat-core'
    needs: test-and-build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: riftborn-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
